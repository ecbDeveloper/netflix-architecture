services:
  api:
    container_name: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ./apps/api/.env
    depends_on:
      api_db:
        condition: service_healthy
      redis:
        condition: service_started
      history_ms:
        condition: service_started
      recommendation_ms:
        condition: service_started
      rabbitmq:
        condition: service_started
      s3:
        condition: service_started

  history_ms:
    container_name: history_ms
    ports:
      - ${HISTORY_MS_PORT}:${HISTORY_MS_PORT}
    build:
      context: .
      dockerfile: apps/history_ms/Dockerfile
    env_file: ./apps/history_ms/.env
    depends_on:
      history_db:
        condition: service_healthy

  recommendation_ms:
    container_name: recommendation_ms
    ports:
      - ${RECOMMENDATION_MS_PORT}:${RECOMMENDATION_MS_PORT}
    build:
      context: .
      dockerfile: apps/recommendation_ms/Dockerfile
    env_file: ./apps/recommendation_ms/.env
    depends_on:
      recommendation_db:
        condition: service_healthy
      history_ms:
        condition: service_started

  content_processing_ms:
    container_name: content_processing_ms
    build:
      context: .
      dockerfile: apps/content_processing_ms/Dockerfile
    env_file: ./apps/content_processing_ms/.env
    depends_on:
      - api
      - rabbitmq
      - s3

include:
  - path: ./infra/queue-compose.yaml
  - path: ./infra/storage-compose.yaml
  - path: ./infra/monitoring/compose.yaml
  - path: ./infra/kong/compose.yaml

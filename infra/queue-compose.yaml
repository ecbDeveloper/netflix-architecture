services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:management
    ports:
      - ${RABBITMQ_PORT}:5672
      - ${RABBITMQ_GUI_PORT}:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_log:/var/log/rabbitmq

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - ${KAFKA_PORT}:9092
    environment:
      - KAFKA_CFG_NODE_ID=${KAFKA_NODE_ID}
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=${KAFKA_ADVERTISED_LISTENERS}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka

  kafka_connect:
    image: quay.io/debezium/connect
    container_name: kafka_connect
    ports:
      - ${KAFKA_CONNECT_PORT}:8083
    environment:
      - BOOTSTRAP_SERVERS=${KAFKA_CONNECT_BOOTSTRAP_SERVERS}
      - GROUP_ID=${KAFKA_CONNECT_GROUP_ID}
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
    depends_on:
      - kafka

  debezium_init:
    image: curlimages/curl
    container_name: debezium_init
    depends_on:
      - kafka_connect
    volumes:
      - ./scripts/register_debezium_connector.sh:/scripts/register_debezium_connector.sh
    environment:
      - KAFKA_CONNECT_HOST=kafka_connect
      - KAFKA_CONNECT_PORT=8083
      - HISTORY_DB_HOST=history_db
      - HISTORY_DB_PORT=5432
      - HISTORY_DB_USER=${HISTORY_DB_USER}
      - HISTORY_DB_PASS=${HISTORY_DB_PASS}
      - HISTORY_DB_NAME=${HISTORY_DB_NAME}
    command: ["sh", "-c", "/scripts/register_debezium_connector.sh"]

volumes:
  rabbitmq_data:
  rabbitmq_log:
  kafka_data:
